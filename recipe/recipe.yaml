schema_version: 1

context:
  version: "0.2.7"

package:
  name: fastspec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastspec/fastspec-${{ version }}.tar.gz
  sha256: 7eded18528243366aca9ff48340e81fd8046b8348dab37c08f0e817f7776b8dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - pip
  run:
    - python >=${{ python_min }}
    - fastcore >=2.2.23
    - fasttransport >=0.0.2

tests:
  - python:
      imports:
        - fastspec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Dynamic OpenAPI and discovery spec client for Python — turn any API spec into a fully-typed async client with attribute chaining, streaming, and file uploads
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/AnswerDotAI/fastspec
  documentation: https://AnswerDotAI.github.io/fastspec/
  repository: https://github.com/AnswerDotAI/fastspec

extra:
  recipe-maintainers:
    - thewchan
