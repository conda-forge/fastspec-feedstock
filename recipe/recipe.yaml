schema_version: 1

context:
  version: "0.1.6"
  python_min: "3.11"

package:
  name: fastspec
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastspec/fastspec-${{ version }}.tar.gz
  sha256: 62cecf5ad0d472b563f7d2daed2d8f98677cd9b1a4a2b5e43312cae8a28fa725

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - pip
  run:
    - python >=${{ python_min }}
    - fastcore >=2.1.16
    - httpx

tests:
  - python:
      imports:
        - fastspec
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Dynamic OpenAPI and discovery spec client for Python — turn any API spec into a fully-typed async client with attribute chaining, streaming, and file uploads
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/fastspec/
  documentation: https://AnswerDotAI.github.io/fastspec/

extra:
  recipe-maintainers:
    - thewchan
